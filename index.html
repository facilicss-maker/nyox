<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyox — Coming Soon</title>
  <style>
    /* Full-screen center alignment */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #000; /* Change this to your brand color if you want */
      font-family: Arial, sans-serif;
    }

    /* Make the image responsive */
    img {
      width: 100%;
      max-width: 800px; /* Optional: limits size on big screens */
      height: auto;
    }

    /* Optional text overlay */
    .text-overlay {
      position: absolute;
      top: 90%;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 24px;
    }

    @media(max-width: 600px) {
      .text-overlay {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <img src="maintenance-page.png" alt="Website under construction">
  <div class="text-overlay">Nyox.com — Launching Soon 🚀</div>
</body>
</html>
