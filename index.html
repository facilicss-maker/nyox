<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyox — Maintenance</title>
  <style>
    /* Make image cover the entire viewport */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #000; /* fallback color */
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* fills screen without distortion */
      display: block;
    }

    /* Text at the bottom */
    .bottom-text {
      position: absolute;
      bottom: 20px; /* distance from bottom */
      width: 100%;
      text-align: center;
      color: #ffffff;
      font-size: 1.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    @media(max-width: 600px) {
      .bottom-text {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <img src="maintenance-page.png" alt="Website under maintenance">
  <div class="bottom-text">
    nyox.co.uk is currently in maintenance. Thank you for your patience.
  </div>
</body>
</html>
